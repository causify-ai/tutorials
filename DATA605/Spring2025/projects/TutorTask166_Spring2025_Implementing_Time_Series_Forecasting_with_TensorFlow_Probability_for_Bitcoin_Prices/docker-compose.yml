# version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bitcoin-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - bitcoin-network

  data-collector:
    build:
      context: ./docker_causify_style/data_collector
      dockerfile: Dockerfile
    volumes:
      - ./docker_causify_style/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - bitcoin-network

  bitcoin-forecast-app:
    build:
      context: ./docker_causify_style/bitcoin_forecast_app
      dockerfile: Dockerfile
    volumes:
      - ./docker_causify_style/data:/app/data
      - ./docker_causify_style/configs:/app/configs
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      - data-collector
      - kafka
    networks:
      - bitcoin-network

  web-frontend:
    build:
      context: ./docker_causify_style/web_app/frontend
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    volumes:
      - ./docker_causify_style/data:/app/data
      - ./docker_causify_style/configs:/app/configs
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - data-collector
      - bitcoin-forecast-app
    networks:
      - bitcoin-network

  dashboard:
    build:
      context: ./docker_causify_style/dashboard
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./docker_causify_style/data:/app/data
      - ./docker_causify_style/configs:/app/configs
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - data-collector
      - bitcoin-forecast-app
    networks:
      - bitcoin-network

networks:
  bitcoin-network:
    driver: bridge 