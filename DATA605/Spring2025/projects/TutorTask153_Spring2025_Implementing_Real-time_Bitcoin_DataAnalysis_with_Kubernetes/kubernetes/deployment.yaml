apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitcoin-fetcher
  labels:
    app: bitcoin-fetcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bitcoin-fetcher
  template:
    metadata:
      labels:
        app: bitcoin-fetcher
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: bitcoin-fetcher
        image: bitcoin-fetcher:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ports:
        - containerPort: 8000
          name: metrics
        env:
        - name: FETCH_INTERVAL
          value: "60"
        - name: CHARTS_DIR
          value: "/data/charts"
        - name: API_URL
          valueFrom:
            configMapKeyRef:
              name: bitcoin-fetcher-config
              key: api_url
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "bitcoin_data"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-password
        livenessProbe:
          httpGet:
            path: /metrics
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /metrics
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
        volumeMounts:
        - name: charts-volume
          mountPath: /data/charts
      volumes:
      - name: charts-volume
        persistentVolumeClaim:
          claimName: bitcoin-data-pvc