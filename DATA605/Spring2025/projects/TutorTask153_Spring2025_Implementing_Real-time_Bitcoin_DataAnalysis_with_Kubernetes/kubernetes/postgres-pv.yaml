# Create PersistentVolume for PostgreSQL
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/data/postgres"
    type: DirectoryOrCreate
---
# Create PersistentVolumeClaim for PostgreSQL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  volumeName: postgres-pv
---
# Create PersistentVolume for Bitcoin data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bitcoin-data-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/data/bitcoin"
    type: DirectoryOrCreate
---
# Create PersistentVolumeClaim for Bitcoin data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitcoin-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: bitcoin-data-pv