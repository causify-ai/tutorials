title = "Gitleaks Config with Binary File Exclusions"
description = "Ignore known binary file types that may cause false positives or scanning errors"

[allowlist]
description = "Ignore binary files"
regexes = [
  "(?i).*\\.docx$",
  "(?i).*\\.pdf$",
  "(?i).*\\.png$",
  "(?i).*\\.jpg$",
  "(?i).*\\.jpeg$",
  "(?i).*\\.gif$",
  "(?i).*\\.zip$",
  "(?i).*\\.tar$",
  "(?i).*\\.gz$",
  "(?i).*\\.7z$",
  "(?i).*\\.exe$",
  "(?i).*\\.dll$"
]
