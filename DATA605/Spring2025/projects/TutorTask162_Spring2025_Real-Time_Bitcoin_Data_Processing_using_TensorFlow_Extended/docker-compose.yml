version: "3.13"  # This is the obsolete line mentioned in the warning

services:
  bitcoin_tfx:
    build:
      context: ./tutorial_template/tfx_pipeline
    ports:
      - "8889:8888"
      - "5000:5000"
      - "5001:5001"
    volumes:
      - ./tutorial_template/tfx_pipeline:/app
    working_dir: /app
    container_name: bitcoin_tfx_env
    command: python simple_deploy.py