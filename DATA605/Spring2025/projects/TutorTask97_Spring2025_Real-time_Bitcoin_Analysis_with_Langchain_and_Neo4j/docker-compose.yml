version: '3.8'
services:
  neo4j:
    image: neo4j:5.15
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/test12345
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.meta.*'
      NEO4J_dbms_security_procedures_allowlist: 'apoc.meta.*'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "test12345", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  loader:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=test12345
    command: python load_backup_to_db.py
    volumes:
      - ./bitcoin_transactions_backup.json:/app/bitcoin_transactions_backup.json

volumes:
  neo4j_data:
