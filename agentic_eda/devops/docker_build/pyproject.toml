[tool.poetry]
name = "agentic-eda"
version = "1.0.0"
description = "Runnable container for tutorials/agentic_eda"
authors = ["Causify AI"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"

# Extra dependency for AgenticEDA.
tabulate = "*"

# Core EDA stack.
boto3 = "*"
numpy = "^2.0"
pandas = "^2.2"
pyarrow = "^17.0"
scikit-learn = "^1.5"
matplotlib = "^3.9"
seaborn = "^0.13"
tqdm = "^4.66"
invoke = "*"
# This is needed in `linters/test/test_isort.py`.
isort = "*"
PyYAML = "^6.0"  
pytest = "*" 
pytest-cov = "*" 
pytest-instafail = "*" 
pytest-rerunfailures = "*" 
pytest-timeout = "*" 
pytest-xdist = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
ipykernel = "^6.29"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
